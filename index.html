        };

        const LoadingScreen = () => (
            <div className="flex items-center justify-center min-h-screen bg-gray-50 font-sans">
                <div className="flex flex-col items-center p-8 bg-white rounded-2xl shadow-lg">
                    <div className="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent mb-4"></div>

                </div>

        );

        const StatCard = ({ title, value, icon, color = 'blue', loading }) => {
            const gradients = {
                blue: 'bg-gradient-to-br from-blue-500 to-blue-700',

                    </div>
                </div>

        };

        const AppLogo = ({ url, className = "w-16 h-16" }) => {
            if (url) {
                return <img src={url} alt="Logo" className={`${className} object-contain rounded-xl bg-white p-1 shadow-sm`} />;
            }
            return (
                <div className={`${className} bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl flex items-center justify-center shadow-2xl border border-white/20 text-white`}>
                    <div className="w-2/3 h-2/3"><Icons.Fingerprint /></div>
                </div>
            );
        };

        const getUserLocation = () => new Promise((res, rej) => {
            if (!navigator.geolocation) return rej(new Error("Geolocalización no soportada"));
            navigator.geolocation.getCurrentPosition(p => res({ latitude: p.coords.latitude, longitude: p.coords.longitude }), e => rej(new Error(e.message)));
        });

        const getHaversineDistance = (c1, c2) => {
            const toRad = x => x * Math.PI / 180; const R = 6371e3;
            const dLat = toRad(c2.latitude - c1.latitude); const dLon = toRad(c2.longitude - c1.longitude);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(c1.latitude)) * Math.cos(toRad(c2.latitude)) * Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };

        const parseShiftTime = (date, time) => {
            if (!time) return new Date(date);
            const [h, m] = time.split(':').map(Number);
            const d = new Date(date); d.setHours(h, m, 0, 0); return d;
        };

        const LoginScreen = ({ db, appId, onLogin, globalConfig }) => {
            const [employeeId, setEmployeeId] = useState('');
            const [password, setPassword] = useState(''); 
            const [error, setError] = useState(null); 
            const [isLoading, setIsLoading] = useState(false); 
            
            const theme = THEMES[globalConfig.theme] || THEMES.azul;
            const { colors } = theme;

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(null); setIsLoading(true);
                const { getDoc, doc, updateDoc } = window.firebase;

                // Falso retardo para UX
                await new Promise(res => setTimeout(res, 500)); 

                const id = employeeId.trim();
                const pass = password.trim();

                if (id.toUpperCase() === 'LUMOS' && pass === 'Luna1309') {
                    onLogin(id, true, "Master Admin"); return;
                }

                try {
                    const adminSnap = await getDoc(doc(db, `/artifacts/${appId}/public/data/admins`, id.toUpperCase()));
                    if (adminSnap.exists() && adminSnap.data().password === pass) { onLogin(id, true, adminSnap.data().name); return; }

                    const empSnap = await getDoc(doc(db, `/artifacts/${appId}/public/data/employees`, id));
                    if (empSnap.exists()) {
                        const data = empSnap.data();
                        if (data.password !== pass) throw new Error("Contraseña incorrecta");
                        if (!data.registeredDevice) await updateDoc(doc(db, `/artifacts/${appId}/public/data/employees`, id), { registeredDevice: navigator.userAgent });
                        else if (data.registeredDevice !== navigator.userAgent) throw new Error("Dispositivo no reconocido");
                        onLogin(id, false, data.name);
                    } else throw new Error("Usuario no encontrado");
                } catch (err) { setError(err.message); setIsLoading(false); }
            };

            return (
                <div className={`min-h-screen w-full flex items-center justify-center ${colors.bgFull} font-sans transition-all duration-500 relative p-4`}>

                    </div>

                            </div>

                        </div>

                        <form onSubmit={handleSubmit} className="space-y-6">

                                <label className={`block text-sm font-bold ${colors.textMain} mb-2 ml-1`}>ID de Usuario</label>
                                <input type="text" value={employeeId} onChange={e => setEmployeeId(e.target.value)} className={`w-full px-5 py-4 rounded-xl ${colors.inputBg} border ${colors.border} focus:ring-2 focus:ring-blue-500/50 outline-none ${colors.textMain} font-medium transition-all`} placeholder='Ej: 12345' disabled={isLoading} />
                            </div>
                            <div>
                                <label className={`block text-sm font-bold ${colors.textMain} mb-2 ml-1`}>Contraseña</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className={`w-full px-5 py-4 rounded-xl ${colors.inputBg} border ${colors.border} focus:ring-2 focus:ring-blue-500/50 outline-none ${colors.textMain} font-medium transition-all`} placeholder="••••••••" disabled={isLoading} />
                            </div>
                            
                            {error && (
                                <div className="bg-red-50 text-red-600 p-4 rounded-xl text-sm flex items-center gap-3 border border-red-100 animate-pulse">
                                    <Icons.Alert /> <span className="font-medium">{error}</span>
                                </div>
                            )}

                            <button type="submit" className={`w-full ${colors.primary} font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all disabled:opacity-70 transform active:scale-[0.98]`}>
                                {isLoading ? 'Verificando...' : 'Iniciar Sesión'}

        const AdminDashboard = ({ db, appId, onLogout, userId, currentAdminName, globalConfig }) => {
            const { collection, addDoc, query, where, onSnapshot, doc, setDoc, deleteDoc, serverTimestamp, updateDoc } = window.firebase;
            
            const theme = THEMES[globalConfig.theme] || THEMES.azul;
            const { colors } = theme;
            const customStyle = globalConfig.textColor ? { color: globalConfig.textColor } : {};

            const [allLogs, setAllLogs] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [zones, setZones] = useState([]);
            const [adminsList, setAdminsList] = useState([]);
            const [blockOutOfFence, setBlockOutOfFence] = useState(false);
            
            const [isLoadingData, setIsLoadingData] = useState(true);
            
            const [newEmployee, setNewEmployee] = useState({ id: '', name: '', dept: '', pass: '', shiftStart: '', shiftEnd: '', lunchStart: '', lunchEnd: '' });
            const [editingEmpId, setEditingEmpId] = useState(null);
            const [zoneForm, setZoneForm] = useState({ name: '', lat: '', lon: '', rad: '150' });
            const [editingZoneId, setEditingZoneId] = useState(null);
            const [newAdmin, setNewAdmin] = useState({ id: '', name: '', pass: '' });

            const [tempLogoUrl, setTempLogoUrl] = useState(globalConfig.logoUrl || '');
            const [selectedTheme, setSelectedTheme] = useState(globalConfig.theme || 'azul');
            const [selectedTextColor, setSelectedTextColor] = useState(globalConfig.textColor || '');
            const [isSavingConfig, setIsSavingConfig] = useState(false);

            const [reportFilters, setReportFilters] = useState({ start: new Date().toISOString().split('T')[0], end: new Date().toISOString().split('T')[0], startTime: '', endTime: '' });
            const [selectedUsers, setSelectedUsers] = useState([]);
            const [selectedTypes, setSelectedTypes] = useState([]); 
            const [generatedReport, setGeneratedReport] = useState([]);
            const [isGenerating, setIsGenerating] = useState(false);

            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(null);

            useEffect(() => {
                if (!userId) return;
                const unsubLogs = onSnapshot(query(collection(db, `/artifacts/${appId}/public/data/attendance_logs`)), (snap) => {
                    setAllLogs(snap.docs.map(d => ({ id: d.id, ...d.data(), timestamp: d.data().timestamp?.toDate() || new Date() })).sort((a, b) => b.timestamp - a.timestamp));
                });
                const unsubEmps = onSnapshot(collection(db, `/artifacts/${appId}/public/data/employees`), (snap) => {
                    setEmployees(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id)));
                });
                const unsubAdmins = onSnapshot(collection(db, `/artifacts/${appId}/public/data/admins`), (snap) => {
                    setAdminsList(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubSettings = onSnapshot(doc(db, `/artifacts/${appId}/public/data/settings`, "geofence"), (snap) => {
                    if (snap.exists()) {
                        setZones(snap.data().zones || []);
                        setBlockOutOfFence(snap.data().blockOutOfFence || false);
                    }
                });
                setIsLoadingData(false);
                return () => { unsubLogs(); unsubEmps(); unsubSettings(); unsubAdmins(); };
            }, [userId]);

            const stats = useMemo(() => {
                const todayStr = new Date().toDateString();
                const todayLogs = allLogs.filter(l => l.timestamp.toDateString() === todayStr);
                const empMap = new Map(employees.map(e => [e.id, e]));
                let lateCount = 0; const processed = new Set();
                todayLogs.forEach(log => {
                    if (log.type === 'in' && !processed.has(log.employeeId)) {
                        processed.add(log.employeeId);
                        const emp = empMap.get(log.employeeId);
                        if (emp?.shiftStart) {
                            const limit = parseShiftTime(log.timestamp, emp.shiftStart);
                            limit.setMinutes(limit.getMinutes() + 5);
                            if (log.timestamp > limit) lateCount++;
                        }
                    }
                });
                return { total: employees.length, logsToday: todayLogs.length, active: processed.size, late: lateCount };
            }, [allLogs, employees]);

            const handleSaveConfig = async () => {
                setIsSavingConfig(true); setSuccess(null); setError(null);
                try {
                    await setDoc(doc(db, `/artifacts/${appId}/public/data/settings`, "config"), { 
                        theme: selectedTheme, 
                        logoUrl: tempLogoUrl,
                        textColor: selectedTextColor
                    }, { merge: true });
                    setSuccess("Configuración guardada.");
                } catch (err) { setError("Error al guardar configuración."); }
                setIsSavingConfig(false);
            };

            const handleSaveEmployee = async (e) => {
                e.preventDefault(); setError(null); setSuccess(null);
                if (!newEmployee.name || !newEmployee.dept) return setError("Faltan campos básicos");
                try {
                    const path = `/artifacts/${appId}/public/data/employees`;
                    const data = { name: newEmployee.name, department: newEmployee.dept, shiftStart: newEmployee.shiftStart, shiftEnd: newEmployee.shiftEnd, lunchStart: newEmployee.lunchStart, lunchEnd: newEmployee.lunchEnd };
                    if (newEmployee.pass) data.password = newEmployee.pass;
                    if (editingEmpId) { await updateDoc(doc(db, path, editingEmpId), data); setSuccess("Empleado actualizado"); }
                    else {
                        if (!newEmployee.id || !newEmployee.pass) return setError("Falta ID o Pass");
                        await setDoc(doc(db, path, newEmployee.id), { ...data, createdAt: serverTimestamp(), registeredDevice: null });
                        setSuccess("Empleado creado");
                    }
                    setNewEmployee({ id: '', name: '', dept: '', pass: '', shiftStart: '', shiftEnd: '', lunchStart: '', lunchEnd: '' }); setEditingEmpId(null);
                } catch (err) { setError("Error guardando empleado"); }
            };
            const handleDeleteEmp = async (id) => { if(confirm("¿Borrar?")) deleteDoc(doc(db, `/artifacts/${appId}/public/data/employees`, id)); };

            const handleSaveAdmin = async (e) => { e.preventDefault(); try { await setDoc(doc(db, `/artifacts/${appId}/public/data/admins`, newAdmin.id.toUpperCase()), { name: newAdmin.name, password: newAdmin.pass, createdAt: serverTimestamp() }); setNewAdmin({id:'',name:'',pass:''}); setSuccess("Admin creado"); } catch (err) { setError("Error"); } };

                    const [sh, sm] = reportFilters.startTime.split(':'); const [eh, em] = reportFilters.endTime.split(':');
                    logs = logs.filter(l => {
                        const m = l.timestamp.getHours() * 60 + l.timestamp.getMinutes();
                        return m >= (sh*60 + +sm) && m <= (eh*60 + +em);
                    });
                }
                if (selectedUsers.length > 0) logs = logs.filter(l => selectedUsers.includes(l.employeeId));
                if (selectedTypes.length > 0) logs = logs.filter(l => selectedTypes.includes(l.type));
                const report = logs.map(l => {
                    const emp = employees.find(e => e.id === l.employeeId);
                    return { id: l.id, employeeId: l.employeeId, name: emp?.name || 'Desconocido', dept: emp?.department || 'N/A', date: l.timestamp.toLocaleDateString(), time: l.timestamp.toLocaleTimeString(), type: l.type, typeLabel: l.type === 'in' ? 'Entrada' : l.type === 'out' ? 'Salida' : l.type === 'break-out' ? 'Inicio Comida' : 'Fin Comida', isOutOfFence: l.isOutOfFence };
                });
                report.sort((a, b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time));
                setGeneratedReport(report); setIsGenerating(false);
            };
            
            const handleExport = () => {
                if (!generatedReport.length) return;
                let csv = "ID,Nombre,Depto,Fecha,Hora,Tipo,Ubicacion\n";
                generatedReport.forEach(r => { csv += `"${r.employeeId}","${r.name}","${r.dept}","${r.date}","${r.time}","${r.typeLabel}","${r.isOutOfFence ? 'Fuera de Zona' : 'En Zona'}"\n`; });
                const link = document.createElement("a"); link.href = encodeURI("data:text/csv;charset=utf-8," + csv); link.download = "reporte_avanzado.csv"; document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

                        {(error || success) && <div className={`lg:col-span-4 p-4 rounded-xl font-medium text-center ${error ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>{error || success}</div>}

                            <div className={`${colors.bgCard} p-6 rounded-2xl shadow-sm border ${colors.border}`}>

                                                    <button onClick={() => handleDeleteAdmin(admin.id)} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-lg transition" title="Eliminar"><Icons.Logout /></button>

                                        <div className="flex gap-2"><input type="time" value={reportFilters.startTime} onChange={e=>setReportFilters({...reportFilters, startTime:e.target.value})} className="border p-2 rounded flex-1 bg-gray-700 text-white font-medium border-gray-600" /><input type="time" value={reportFilters.endTime} onChange={e=>setReportFilters({...reportFilters, endTime:e.target.value})} className="border p-2 rounded flex-1 bg-gray-700 text-white font-medium border-gray-600" /></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div className="border p-2 rounded max-h-32 overflow-y-auto bg-white border-gray-200"><div className="text-xs font-bold mb-1 sticky top-0 bg-white text-gray-900">Usuarios</div><label className="block text-xs hover:bg-gray-100 p-1 cursor-pointer text-gray-800"><input type="checkbox" className="mr-1" onChange={e=>setSelectedUsers(e.target.checked ? employees.map(em=>em.id) : [])} /> Todos</label>{employees.map(e => (<label key={e.id} className="block text-xs hover:bg-gray-100 p-1 cursor-pointer text-gray-800"><input type="checkbox" className="mr-1" checked={selectedUsers.includes(e.id)} onChange={ev=>{if(ev.target.checked) setSelectedUsers([...selectedUsers, e.id]); else setSelectedUsers(selectedUsers.filter(id=>id!==e.id))}} /> {e.name}</label>))}</div>
                                        <div className="border p-2 rounded bg-white border-gray-200"><div className="text-xs font-bold mb-1 text-gray-900">Tipos</div>{[{id: 'in', label: 'Entrada'}, {id: 'out', label: 'Salida'}, {id: 'break-out', label: 'Inicio Comida'}, {id: 'break-in', label: 'Fin Comida'}].map(t => (<label key={t.id} className="block text-xs hover:bg-gray-100 p-1 cursor-pointer text-gray-800"><input type="checkbox" className="mr-1" checked={selectedTypes.includes(t.id)} onChange={ev=>{if(ev.target.checked) setSelectedTypes([...selectedTypes, t.id]); else setSelectedTypes(selectedTypes.filter(x=>x!==t.id))}} /> {t.label}</label>))}</div>

                                {generatedReport.length > 0 && (<div className={`mt-6 overflow-x-auto border rounded-lg ${colors.border}`}><table className="w-full text-xs text-left"><thead className={`bg-gray-100 dark:bg-gray-800 uppercase font-bold ${colors.textSec}`}><tr><th className="p-2">Nombre</th><th className="p-2">Fecha</th><th className="p-2">Hora</th><th className="p-2">Tipo</th><th className="p-2">Ubicación</th></tr></thead><tbody className={`divide-y ${colors.border}`}>{generatedReport.map((r,i) => (<tr key={i} className="hover:bg-black/5"><td className={`p-2 font-bold ${colors.textMain}`}>{r.name}</td><td className={`p-2 ${colors.textMain}`}>{r.date}</td><td className={`p-2 font-mono ${colors.textMain}`}>{r.time}</td><td className="p-2"><span className={`px-2 py-1 rounded text-white font-bold text-[10px] ${r.type==='in'?'bg-green-500':r.type==='out'?'bg-red-500':'bg-purple-500'}`}>{r.typeLabel}</span></td><td className={`p-2 ${colors.textMain}`}>{r.isOutOfFence ? '❌ Fuera' : '✅ En Sitio'}</td></tr>))}</tbody></table></div>)}
                            </div>
                        </div>

                        <div className="lg:col-span-1 space-y-6">

        };

        const EmployeeScreen = ({ db, appId, onLogout, employeeData, globalConfig }) => {
            const { collection, addDoc, query, where, onSnapshot, getDoc, doc } = window.firebase;
            const theme = THEMES[globalConfig.theme] || THEMES.azul;
            const { colors } = theme;
            const [logs, setLogs] = useState([]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [error, setError] = useState(null);

            useEffect(() => {
                const q = query(collection(db, `/artifacts/${appId}/public/data/attendance_logs`), where("employeeId", "==", employeeData.id));
                return onSnapshot(q, (s) => setLogs(s.docs.map(d => ({id:d.id, ...d.data(), timestamp:d.data().timestamp.toDate()})).sort((a,b) => b.timestamp - a.timestamp)));
            }, [employeeData]);

            const handleClock = async (type) => {
                setIsSubmitting(true); setError(null);
                try {
                    const loc = await getUserLocation();
                    const settings = await getDoc(doc(db, `/artifacts/${appId}/public/data/settings`, "geofence"));
                    let isOutOfFence = false;
                    if(settings.exists() && settings.data().zones?.length > 0) {
                        const inside = settings.data().zones.some(z => getHaversineDistance(loc, z) <= z.radius);
                        if(!inside) { if(settings.data().blockOutOfFence) throw new Error("Fuera de zona permitida."); isOutOfFence = true; }
                    }
                    await addDoc(collection(db, `/artifacts/${appId}/public/data/attendance_logs`), {
                        employeeId: employeeData.id, type, timestamp: serverTimestamp(), location: loc, isOutOfFence, userAgent: navigator.userAgent
                    });
                } catch (e) { setError(e.message); }
                setIsSubmitting(false);
            };

            const lastLog = logs[0]?.type;

            return (
                <div className={`min-h-screen ${colors.bgApp} flex items-center justify-center p-4 transition-colors duration-500`}>

                        </div>
                        <div className="p-8 space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={() => handleClock('in')} disabled={isSubmitting || lastLog === 'in' || lastLog === 'break-out'} className="bg-green-500 hover:bg-green-600 disabled:bg-gray-200 text-white py-4 rounded-xl font-bold shadow-lg transition transform active:scale-95 flex flex-col items-center"><Icons.CheckCircle /> Entrada</button>

                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={() => handleClock('break-out')} disabled={isSubmitting || lastLog !== 'in'} className="bg-purple-500 hover:bg-purple-600 disabled:bg-gray-200 text-white py-3 rounded-xl font-bold shadow-md transition transform active:scale-95 text-sm flex flex-col items-center"><Icons.Coffee /> Inicio Comida</button>
                                <button onClick={() => handleClock('break-in')} disabled={isSubmitting || lastLog !== 'break-out'} className="bg-indigo-500 hover:bg-indigo-600 disabled:bg-gray-200 text-white py-3 rounded-xl font-bold shadow-md transition transform active:scale-95 text-sm flex flex-col items-center"><Icons.Clock /> Fin Comida</button>
                            </div>
                            
                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-center text-sm">{error}</div>}

                            <div className="mt-6">
                                <h3 className={`text-xs font-bold ${colors.textSec} uppercase mb-3`}>Historial Hoy</h3>
                                <div className="max-h-48 overflow-y-auto space-y-2 pr-1">
                                    {logs.filter(l => l.timestamp.toDateString() === new Date().toDateString()).map(log => (
                                        <div key={log.id} className={`flex justify-between p-3 rounded-lg border ${colors.border} ${colors.inputBg}`}>
                                            <span className={`text-xs font-bold ${log.type.includes('in') ? 'text-green-600' : log.type.includes('out') ? (log.type==='break-out'?'text-purple-600':'text-red-600') : ''}`}>
                                                {log.type==='in'?'ENTRADA':log.type==='out'?'SALIDA':log.type==='break-out'?'INICIO COMIDA':'FIN COMIDA'}
                                            </span>
                                            <span className={`text-xs ${colors.textSec} font-mono`}>{log.timestamp.toLocaleTimeString()}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                        <button onClick={onLogout} className={`w-full p-4 ${colors.inputBg} text-gray-500 text-sm hover:opacity-80 font-medium`}>Cerrar Sesión</button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const { getAuth, onAuthStateChanged, signInAnonymously } = window.firebase;
            const [userId, setUserId] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [employeeData, setEmployeeData] = useState(null);
            const [adminName, setAdminName] = useState('');
            const [config, setConfig] = useState({ theme: 'azul', logoUrl: '', textColor: '' });

            useEffect(() => {
                // Autenticación anónima inicial para conectar a Firebase
                const unsub = onAuthStateChanged(auth, (user) => {
                    if (user) { setUserId(user.uid); setIsAuthReady(true); }
                    else { signInAnonymously(auth).catch(console.error); }
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!userId) return;
                // Cargar configuración global
                const { doc, onSnapshot } = window.firebase;
                return onSnapshot(doc(db, `/artifacts/${appId}/public/data/settings`, "config"), s => s.exists() && setConfig(s.data()));
            }, [userId]);

            const handleLogin = (id, admin, name) => {
                if (admin) { setIsAdmin(true); setAdminName(name); setEmployeeData(null); }
                else { setIsAdmin(false); setEmployeeData({ id, name }); }
            };

            if (!isAuthReady) return <LoadingScreen />;
            if (isAdmin) return <AdminDashboard db={db} appId={appId} onLogout={() => {setUserId(null); setIsAdmin(false)}} userId={userId} currentAdminName={adminName} globalConfig={config} />;
            if (employeeData) return <EmployeeScreen db={db} appId={appId} onLogout={() => setEmployeeData(null)} employeeData={employeeData} globalConfig={config} />;
            
            return <LoginScreen db={db} appId={appId} onLogin={handleLogin} globalConfig={config} />;
        };

        // Renderizado inicial
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
