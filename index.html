<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumos Assist</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        input[type="date"], input[type="time"] { color-scheme: dark; }
        body { margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Spinner de carga inicial (HTML puro) */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loader {
            width: 48px; height: 48px;
            border: 5px solid #FFF; border-bottom-color: #3b82f6;
            border-radius: 50%; display: inline-block;
            box-sizing: border-box; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <div id="loader-overlay">
        <span class="loader"></span>
        <p style="color: white; margin-top: 15px; font-family: sans-serif; font-size: 14px;">Iniciando Lumos...</p>
    </div>

    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, setDoc, getDoc, deleteDoc, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWb9rW9iJluudZksJpVAgrB6PG27m4Tqg",
            authDomain: "lumos-assist-39e09.firebaseapp.com",
            projectId: "lumos-assist-39e09",
            storageBucket: "lumos-assist-39e09.firebasestorage.app",
            messagingSenderId: "525173322066",
            appId: "1:525173322066:web:5d0eb9db67d6cb11cd4a8b"
        };

        try {
            const app = initializeApp(firebaseConfig);
            // Exponemos Firebase al navegador de forma segura
            window.firebaseModules = {
                auth: getAuth(app),
                db: getFirestore(app),
                methods: { 
                    signInAnonymously, onAuthStateChanged, collection, addDoc, 
                    query, where, onSnapshot, doc, setDoc, getDoc, deleteDoc, 
                    serverTimestamp, updateDoc 
                }
            };
            
            // Avisamos a React que Firebase está listo
            console.log("Firebase cargado exitosamente.");
            window.dispatchEvent(new Event('firebase-ready'));
        } catch (e) {
            console.error("Error cargando Firebase:", e);
            document.querySelector('#loader-overlay p').innerText = "Error de conexión: " + e.message;
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SISTEMA DE TEMAS ---
        const THEMES = {
            azul: { id: 'azul', name: 'Azul Corporativo', colors: { bgApp: 'bg-slate-100', bgFull: 'bg-gradient-to-br from-blue-900 via-blue-700 to-indigo-900', bgCard: 'bg-white', textMain: 'text-slate-900', textSec: 'text-slate-500', border: 'border-slate-200', inputBg: 'bg-slate-50', primary: 'bg-blue-700 hover:bg-blue-800 text-white', accent: 'text-blue-700', cardShadow: 'shadow-blue-900/10' } },
            celeste: { id: 'celeste', name: 'Celeste Fresco', colors: { bgApp: 'bg-sky-50', bgFull: 'bg-gradient-to-tr from-sky-400 to-blue-500', bgCard: 'bg-white', textMain: 'text-sky-950', textSec: 'text-sky-600', border: 'border-sky-100', inputBg: 'bg-sky-50/30', primary: 'bg-sky-500 hover:bg-sky-600 text-white', accent: 'text-sky-600', cardShadow: 'shadow-sky-200/50' } },
            gris: { id: 'gris', name: 'Gris Moderno', colors: { bgApp: 'bg-gray-100', bgFull: 'bg-gradient-to-br from-gray-700 to-gray-900', bgCard: 'bg-white', textMain: 'text-gray-800', textSec: 'text-gray-500', border: 'border-gray-300', inputBg: 'bg-gray-50', primary: 'bg-gray-800 hover:bg-gray-900 text-white', accent: 'text-gray-700', cardShadow: 'shadow-gray-400/20' } },
            oscuro: { id: 'oscuro', name: 'Oscuro Total', colors: { bgApp: 'bg-neutral-900', bgFull: 'bg-gradient-to-br from-black via-neutral-900 to-neutral-800', bgCard: 'bg-neutral-800', textMain: 'text-gray-100', textSec: 'text-gray-400', border: 'border-neutral-700', inputBg: 'bg-neutral-700', primary: 'bg-blue-600 hover:bg-blue-700 text-white', accent: 'text-blue-400', cardShadow: 'shadow-black/50' } },
            blanco: { id: 'blanco', name: 'Blanco Puro', colors: { bgApp: 'bg-white', bgFull: 'bg-gray-100', bgCard: 'bg-white', textMain: 'text-black', textSec: 'text-gray-600', border: 'border-gray-200', inputBg: 'bg-gray-50 border', primary: 'bg-black hover:bg-gray-800 text-white', accent: 'text-black', cardShadow: 'shadow-xl' } }
        };

        const Icons = {
            Fingerprint: () => <svg className="w-full h-full" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.2-2.85.577-4.147l.313-.993m1.814 12.998a2.968 2.968 0 00-2.167 1.846m17.05-2.166a2.966 2.966 0 012.412 2.039M12 4.07a13.862 13.862 0 014.07 1.891m-8.135.004A13.862 13.862 0 0112 4.07M3 15.364c0 1.564.36 3.045 1 4.364m0 0c1.744-2.772 2.753-6.054 2.753-9.571 0-1.017-.07-2.019-.203-3m2.118 6.844A21.88 21.88 0 005.171 17" /></svg>,
            Users: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            CheckCircle: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Clock: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Alert: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            Logout: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
            Admin: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Coffee: () => <svg className="w-6 h-6 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3" /></svg>,
            Map: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        };

        const AppLogo = ({ url, className = "w-16 h-16" }) => {
            if (url) return <img src={url} alt="Logo" className={`${className} object-contain rounded-xl bg-white p-1 shadow-sm`} />;
            return (
                <div className={`${className} bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl flex items-center justify-center shadow-2xl border border-white/20 text-white`}>
                    <div className="w-2/3 h-2/3"><Icons.Fingerprint /></div>
                </div>
            );
        };

        const StatCard = ({ title, value, icon, color = 'blue', loading }) => {
            const gradients = {
                blue: 'bg-gradient-to-br from-blue-500 to-blue-700',
                green: 'bg-gradient-to-br from-emerald-500 to-emerald-700',
                purple: 'bg-gradient-to-br from-purple-500 to-purple-700',
                red: 'bg-gradient-to-br from-rose-500 to-rose-700',
            };
            return (
                <div className={`${gradients[color]} p-6 rounded-2xl shadow-lg text-white transition-transform transform hover:scale-105`}>
                    <div className="flex justify-between items-start">
                        <div><p className="text-white/80 text-xs font-bold uppercase tracking-wider mb-1">{title}</p>{loading ? <div className="h-8 w-24 bg-white/20 animate-pulse rounded mt-2"></div> : <h3 className="text-4xl font-extrabold">{value}</h3>}</div>
                        <div className="p-2 bg-white/10 rounded-lg backdrop-blur-sm text-white">{icon}</div>
                    </div>
                </div>
            );
        };

        const getUserLocation = () => new Promise((res, rej) => {
            if (!navigator.geolocation) return rej(new Error("Activa el GPS"));
            navigator.geolocation.getCurrentPosition(p => res({ latitude: p.coords.latitude, longitude: p.coords.longitude }), e => rej(new Error("Error GPS")));
        });

        const getHaversineDistance = (c1, c2) => {
            const toRad = x => x * Math.PI / 180; const R = 6371e3;
            const dLat = toRad(c2.latitude - c1.latitude); const dLon = toRad(c2.longitude - c1.longitude);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(c1.latitude)) * Math.cos(toRad(c2.latitude)) * Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };

        // --- PANTALLAS ---
        const LoginScreen = ({ onLogin, globalConfig }) => {
            const { getDoc, doc, updateDoc, db } = window.firebaseModules.methods;
            const database = window.firebaseModules.db;
            
            const [id, setId] = useState(''); const [pass, setPass] = useState(''); const [error, setError] = useState(null); const [loading, setLoading] = useState(false);
            const theme = THEMES[globalConfig.theme] || THEMES.azul;
            const { colors } = theme;

            const handleSubmit = async (e) => {
                e.preventDefault(); setError(null); setLoading(true);
                const trimId = id.trim(); const trimPass = pass.trim();
                await new Promise(r => setTimeout(r, 500));

                if (trimId.toUpperCase() === 'LUMOS' && trimPass === 'Luna1309') { onLogin(trimId, true, "Master Admin"); return; }
                
                try {
                    const adminSnap = await getDoc(doc(database, `artifacts/lumos-assist-39e09/public/data/admins`, trimId.toUpperCase()));
                    if (adminSnap.exists() && adminSnap.data().password === trimPass) { onLogin(trimId, true, adminSnap.data().name); return; }

                    const empRef = doc(database, `artifacts/lumos-assist-39e09/public/data/employees`, trimId);
                    const empSnap = await getDoc(empRef);
                    
                    if (empSnap.exists()) {
                        const data = empSnap.data();
                        if (data.password !== trimPass) throw new Error("Contraseña incorrecta");
                        if (!data.registeredDevice) await updateDoc(empRef, { registeredDevice: navigator.userAgent });
                        else if (data.registeredDevice !== navigator.userAgent) throw new Error("Dispositivo no reconocido");
                        onLogin(trimId, false, data.name);
                    } else throw new Error("Usuario no encontrado");
                } catch (err) { setError(err.message); setLoading(false); }
            };

            return (
                <div className={`min-h-screen w-full flex items-center justify-center ${colors.bgFull} font-sans relative p-4`}>
                    <div className="absolute inset-0 overflow-hidden">
                        <div className="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-white rounded-full mix-blend-overlay filter blur-3xl opacity-10 animate-pulse"></div>
                        <div className="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-white rounded-full mix-blend-overlay filter blur-3xl opacity-10 animate-pulse"></div>
                    </div>
                    <div className={`relative w-full max-w-md p-8 rounded-3xl shadow-2xl ${colors.bgCard} ${colors.cardShadow} border ${colors.border} backdrop-blur-sm`}>
                        <div className="text-center mb-8">
                            <div className="flex justify-center mb-6"><AppLogo url={globalConfig.logoUrl} className="w-24 h-24" /></div>
                            <h2 className={`text-3xl font-extrabold ${colors.textMain} tracking-tight`}>Lumos Assist</h2>
                            <p className={`text-sm mt-2 ${colors.textSec}`}>Plataforma de Gestión de Asistencia</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <input value={id} onChange={e=>setId(e.target.value)} className={`w-full px-5 py-4 rounded-xl ${colors.inputBg} border ${colors.border} ${colors.textMain} outline-none focus:ring-2 focus:ring-blue-500`} placeholder="ID Usuario" />
                            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} className={`w-full px-5 py-4 rounded-xl ${colors.inputBg} border ${colors.border} ${colors.textMain} outline-none focus:ring-2 focus:ring-blue-500`} placeholder="Contraseña" />
                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-center text-sm font-bold">{error}</div>}
                            <button className={`w-full ${colors.primary} font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95`}>{loading ? '...' : 'Entrar'}</button>
                        </form>
                        <p className={`text-center mt-6 text-xs ${colors.textSec}`}>© 2025 Lumos Assist</p>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD ADMIN ---
        const AdminDashboard = ({ onLogout, userId, currentAdminName, globalConfig }) => {
            const { collection, query, onSnapshot, doc, setDoc, deleteDoc, updateDoc, serverTimestamp } = window.firebaseModules.methods;
            const database = window.firebaseModules.db;
            const { colors } = THEMES[globalConfig.theme] || THEMES.azul;
            const customStyle = globalConfig.textColor ? { color: globalConfig.textColor } : {};

            const [allLogs, setAllLogs] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [zones, setZones] = useState([]);
            const [adminsList, setAdminsList] = useState([]);
            const [blockOut, setBlockOut] = useState(false);
            const [loading, setLoading] = useState(true);
            const [empForm, setEmpForm] = useState({ id: '', name: '', dept: '', pass: '', shiftStart: '', shiftEnd: '', lunchStart: '', lunchEnd: '' });
            const [editEmpId, setEditEmpId] = useState(null);
            const [zoneForm, setZoneForm] = useState({ name: '', lat: '', lon: '', rad: '150' });
            const [newAdmin, setNewAdmin] = useState({ id: '', name: '', pass: '' });
            const [configForm, setConfigForm] = useState({ theme: 'azul', logoUrl: '', textColor: '' });
            const [filters, setFilters] = useState({ start: new Date().toISOString().split('T')[0], end: new Date().toISOString().split('T')[0], startTime: '', endTime: '' });
            const [report, setReport] = useState([]);

            const appId = "lumos-assist-39e09";

            useEffect(() => {
                if(!userId) return;
                const u1 = onSnapshot(query(collection(database, `artifacts/${appId}/public/data/attendance_logs`)), s => setAllLogs(s.docs.map(d => ({id:d.id, ...d.data(), timestamp:d.data().timestamp.toDate()})).sort((a,b)=>b.timestamp-a.timestamp)));
                const u2 = onSnapshot(collection(database, `artifacts/${appId}/public/data/employees`), s => setEmployees(s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>a.id.localeCompare(b.id))));
                const u3 = onSnapshot(collection(database, `artifacts/${appId}/public/data/admins`), s => setAdminsList(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const u4 = onSnapshot(doc(database, `artifacts/${appId}/public/data/settings`, "geofence"), s => { if(s.exists()) { setZones(s.data().zones||[]); setBlockOut(s.data().blockOutOfFence||false); }});
                const u5 = onSnapshot(doc(database, `artifacts/${appId}/public/data/settings`, "config"), s => { if(s.exists()) setConfigForm(s.data()); setLoading(false); });
                return () => { u1(); u2(); u3(); u4(); u5(); };
            }, [userId]);

            const saveConfig = async () => { await setDoc(doc(database, `artifacts/${appId}/public/data/settings`, "config"), configForm, { merge: true }); alert("Guardado"); };
            
            const saveEmp = async (e) => {
                e.preventDefault();
                const d = { name: empForm.name, department: empForm.dept, shiftStart: empForm.shiftStart, shiftEnd: empForm.shiftEnd, lunchStart: empForm.lunchStart, lunchEnd: empForm.lunchEnd };
                if(empForm.pass) d.password = empForm.pass;
                if(editEmpId) await updateDoc(doc(database, `artifacts/${appId}/public/data/employees`, editEmpId), d);
                else await setDoc(doc(database, `artifacts/${appId}/public/data/employees`, empForm.id), {...d, createdAt: serverTimestamp()});
                setEditEmpId(null); setEmpForm({ id: '', name: '', dept: '', pass: '', shiftStart: '', shiftEnd: '', lunchStart: '', lunchEnd: '' });
            };
            const delEmp = async(id) => confirm("¿Borrar?") && deleteDoc(doc(database, `artifacts/${appId}/public/data/employees`, id));
            const saveZone = async(e) => {
                e.preventDefault(); const z = { name: zoneForm.name, latitude: parseFloat(zoneForm.lat), longitude: parseFloat(zoneForm.lon), radius: parseInt(zoneForm.rad), id: crypto.randomUUID() };
                await setDoc(doc(database, `artifacts/${appId}/public/data/settings`, "geofence"), { zones: [...zones, z], blockOutOfFence: blockOut }, { merge: true });
                setZoneForm({ name: '', lat: '', lon: '', rad: '150' });
            };
            const delZone = async(id) => { await setDoc(doc(database, `artifacts/${appId}/public/data/settings`, "geofence"), { zones: zones.filter(z=>z.id!==id), blockOutOfFence: blockOut }, { merge: true }); };
            const locZone = async() => { try{const l=await getUserLocation(); setZoneForm({...zoneForm, lat:l.latitude, lon:l.longitude});}catch(e){alert(e.message);} };
            const saveAdmin = async(e) => { e.preventDefault(); await setDoc(doc(database, `artifacts/${appId}/public/data/admins`, newAdmin.id.toUpperCase()), { name: newAdmin.name, password: newAdmin.pass }); setNewAdmin({id:'',name:'',pass:''}); };
            const delAdmin = async(id) => confirm("¿Borrar?") && deleteDoc(doc(database, `artifacts/${appId}/public/data/admins`, id));

            const genReport = () => {
                const s = new Date(filters.start); s.setHours(0,0,0,0);
                const e = new Date(filters.end); e.setHours(23,59,59,999);
                let res = allLogs.filter(l => l.timestamp >= s && l.timestamp <= e);
                setReport(res.map(l => {
                    const emp = employees.find(e => e.id === l.employeeId);
                    return { ...l, name: emp?.name||l.employeeId, dept: emp?.department, date: l.timestamp.toLocaleDateString(), time: l.timestamp.toLocaleTimeString(), label: l.type==='in'?'Entrada':l.type==='out'?'Salida':l.type==='break-out'?'Inicio Comida':'Fin Comida' };
                }).sort((a,b)=>a.timestamp-b.timestamp));
            };

            const exportCSV = () => {
                let csv = "ID,Nombre,Fecha,Hora,Tipo,Ubicacion\n" + report.map(r => `"${r.employeeId}","${r.name}","${r.date}","${r.time}","${r.label}","${r.isOutOfFence?'Fuera':'En Sitio'}"`).join("\n");
                const a = document.createElement("a"); a.href = encodeURI("data:text/csv;charset=utf-8,"+csv); a.download = "reporte.csv"; a.click();
            };

            return (
                <div className={`min-h-screen ${colors.bgApp} p-4 md:p-8 font-sans`}>
                    <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
                        <div className="lg:col-span-4 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <div className="flex items-center gap-3"><AppLogo url={configForm.logoUrl} className="w-10 h-10" /><div><h1 className={`text-2xl font-bold ${colors.textMain}`} style={customStyle}>Panel RH</h1><p className="text-gray-500 text-xs">Hola, {currentAdminName}</p></div></div>
                            <button onClick={onLogout} className="text-red-500 border border-red-200 px-3 py-1 rounded hover:bg-red-50">Salir</button>
                        </div>

                        <div className="lg:col-span-3 grid grid-cols-2 md:grid-cols-4 gap-4">
                            <StatCard title="Empleados" value={employees.length} icon={<Icons.Users/>} color="blue" loading={loading}/>
                            <StatCard title="Registros Hoy" value={allLogs.filter(l=>l.timestamp.toDateString()===new Date().toDateString()).length} icon={<Icons.CheckCircle/>} color="green" loading={loading}/>
                            <StatCard title="Zonas" value={zones.length} icon={<Icons.Map/>} color="purple" loading={loading}/>
                            <StatCard title="Admins" value={adminsList.length+1} icon={<Icons.Admin/>} color="red" loading={loading}/>
                        </div>

                        <div className="lg:col-span-1 lg:row-span-3">
                            <div className={`${colors.bgCard} p-4 rounded-xl shadow-sm border ${colors.border} h-[80vh] flex flex-col sticky top-4`}>
                                <h3 className={`font-bold mb-3 ${colors.textMain} flex items-center gap-2`} style={customStyle}><span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> En Vivo</h3>
                                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                                    {allLogs.slice(0,30).map(l => (
                                        <div key={l.id} className={`p-2 rounded border text-xs ${colors.inputBg} ${colors.border}`}>
                                            <div className="font-bold text-gray-700">{employees.find(e=>e.id===l.employeeId)?.name || l.employeeId}</div>
                                            <div className="flex justify-between mt-1">
                                                <span className={`font-bold ${l.type.includes('in')?'text-green-600':l.type.includes('out')?'text-red-600':'text-purple-600'}`}>{l.type.toUpperCase()}</span>
                                                <span className="text-gray-500">{l.timestamp.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
                                            </div>
                                            {l.isOutOfFence && <div className="text-red-500 font-bold mt-1">⚠️ Fuera de Zona</div>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className={`lg:col-span-3 ${colors.bgCard} p-6 rounded-xl shadow-sm border ${colors.border}`}>
                            <h3 className={`font-bold mb-4 ${colors.textMain}`} style={customStyle}>Configuración Visual</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div><label className="text-xs font-bold text-gray-400 block mb-1">Tema</label><div className="flex flex-wrap gap-1">{Object.values(THEMES).map(t=><button key={t.id} onClick={()=>setConfigForm({...configForm, theme:t.id})} className={`px-2 py-1 text-xs border rounded ${configForm.theme===t.id?'bg-blue-100 border-blue-500 text-black':'bg-white text-gray-700'}`}>{t.name}</button>)}</div></div>
                                <div><label className="text-xs font-bold text-gray-400 block mb-1">Logo URL</label><input value={configForm.logoUrl} onChange={e=>setConfigForm({...configForm, logoUrl:e.target.value})} className="w-full border rounded p-1 text-sm bg-white text-gray-900" /></div>
                                <div><label className="text-xs font-bold text-gray-400 block mb-1">Color Texto</label><div className="flex gap-2"><input type="color" value={configForm.textColor||'#000000'} onChange={e=>setConfigForm({...configForm, textColor:e.target.value})} className="h-8 w-12 border rounded bg-white" /><button onClick={saveConfig} className="bg-black text-white px-3 rounded text-xs">Guardar</button></div></div>
                            </div>
                        </div>

                        <div className={`lg:col-span-3 ${colors.bgCard} p-6 rounded-xl shadow-sm border ${colors.border}`}>
                            <h3 className={`font-bold mb-4 ${colors.textMain}`} style={customStyle}>Empleados</h3>
                            <form onSubmit={saveEmp} className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
                                <input value={empForm.id} onChange={e=>setEmpForm({...empForm, id:e.target.value})} placeholder="ID" className="border p-2 rounded bg-white text-gray-900" disabled={!!editEmpId} />
                                <input value={empForm.name} onChange={e=>setEmpForm({...empForm, name:e.target.value})} placeholder="Nombre" className="border p-2 rounded bg-white text-gray-900" />
                                <input value={empForm.dept} onChange={e=>setEmpForm({...empForm, dept:e.target.value})} placeholder="Depto" className="border p-2 rounded bg-white text-gray-900" />
                                <input type="password" value={empForm.pass} onChange={e=>setEmpForm({...empForm, pass:e.target.value})} placeholder="Pass" className="border p-2 rounded bg-white text-gray-900" />
                                <div className="col-span-2 flex gap-1 items-center bg-gray-100 p-1 rounded text-xs"><span className="font-bold w-12 text-gray-700">Turno:</span><input type="time" value={empForm.shiftStart} onChange={e=>setEmpForm({...empForm, shiftStart:e.target.value})} className="border rounded bg-white text-gray-900" /><input type="time" value={empForm.shiftEnd} onChange={e=>setEmpForm({...empForm, shiftEnd:e.target.value})} className="border rounded bg-white text-gray-900" /></div>
                                <div className="col-span-2 flex gap-1 items-center bg-gray-100 p-1 rounded text-xs"><span className="font-bold w-12 text-gray-700">Comida:</span><input type="time" value={empForm.lunchStart} onChange={e=>setEmpForm({...empForm, lunchStart:e.target.value})} className="border rounded bg-white text-gray-900" /><input type="time" value={empForm.lunchEnd} onChange={e=>setEmpForm({...empForm, lunchEnd:e.target.value})} className="border rounded bg-white text-gray-900" /></div>
                                <button className="col-span-4 bg-blue-600 text-white p-2 rounded font-bold">Guardar Empleado</button>
                            </form>
                            <div className="max-h-48 overflow-y-auto"><table className="w-full text-xs text-left"><thead><tr className="text-gray-400 border-b"><th>ID</th><th>Nombre</th><th>Turno</th><th>Acción</th></tr></thead><tbody className={colors.textMain}>{employees.map(e=><tr key={e.id} className="border-b"><td className="p-2 font-mono">{e.id}</td><td className="p-2">{e.name}</td><td className="p-2">{e.shiftStart}-{e.shiftEnd}</td><td className="p-2 flex gap-2"><button onClick={()=>{setEditEmpId(e.id); setEmpForm({...e, pass:''})}} className="text-blue-500">Edit</button><button onClick={()=>delEmp(e.id)} className="text-red-500">Del</button></td></tr>)}</tbody></table></div>
                        </div>

                         <div className={`lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6`}>
                             <div className={`${colors.bgCard} p-6 rounded-xl shadow-sm border ${colors.border}`}>
                                <h3 className={`font-bold mb-2 ${colors.textMain}`}>Zonas (Geocercas)</h3>
                                <div className="flex gap-2 mb-2 items-center"><input type="checkbox" checked={blockOut} onChange={e=>setDoc(doc(database, `artifacts/${appId}/public/data/settings`, "geofence"), { zones, blockOutOfFence:e.target.checked }, {merge:true})} /><span className="text-xs text-gray-500">Bloquear Fuera</span></div>
                                <form onSubmit={saveZone} className="grid grid-cols-4 gap-1 mb-2">
                                    <input placeholder="Nom" value={zoneForm.name} onChange={e=>setZoneForm({...zoneForm, name:e.target.value})} className="border p-1 rounded bg-white text-gray-900" />
                                    <input placeholder="Lat" type="number" step="any" value={zoneForm.lat} onChange={e=>setZoneForm({...zoneForm, lat:e.target.value})} className="border p-1 rounded bg-white text-gray-900" />
                                    <input placeholder="Lon" type="number" step="any" value={zoneForm.lon} onChange={e=>setZoneForm({...zoneForm, lon:e.target.value})} className="border p-1 rounded bg-white text-gray-900" />
                                    <input placeholder="Rad" type="number" value={zoneForm.rad} onChange={e=>setZoneForm({...zoneForm, rad:e.target.value})} className="border p-1 rounded bg-white text-gray-900" />
                                    <button type="button" onClick={locZone} className="col-span-2 bg-blue-100 text-blue-700 p-1 rounded text-xs">📍 Mi Ubic.</button>
                                    <button className="col-span-2 bg-green-600 text-white p-1 rounded text-xs">Guardar</button>
                                </form>
                                <div className="max-h-24 overflow-y-auto text-xs space-y-1">{zones.map(z=><div key={z.id} className="flex justify-between bg-gray-50 text-gray-800 p-1 rounded"><span>{z.name}</span><button onClick={()=>delZone(z.id)} className="text-red-500">X</button></div>)}</div>
                             </div>

                             <div className={`${colors.bgCard} p-6 rounded-xl shadow-sm border ${colors.border}`}>
                                <h3 className={`font-bold mb-2 ${colors.textMain}`}>Administradores</h3>
                                <form onSubmit={saveAdmin} className="flex gap-2 mb-2">
                                   <input placeholder="User" value={newAdmin.id} onChange={e=>setNewAdmin({...newAdmin, id:e.target.value.toUpperCase()})} className="border p-1 rounded w-1/3 bg-white text-gray-900" />
                                   <input placeholder="Nom" value={newAdmin.name} onChange={e=>setNewAdmin({...newAdmin, name:e.target.value})} className="border p-1 rounded w-1/3 bg-white text-gray-900" />
                                   <input type="password" placeholder="Pass" value={newAdmin.pass} onChange={e=>setNewAdmin({...newAdmin, pass:e.target.value})} className="border p-1 rounded w-1/3 bg-white text-gray-900" />
                                   <button className="bg-blue-600 text-white px-2 rounded text-xs">OK</button>
                                </form>
                                <div className="max-h-24 overflow-y-auto text-xs space-y-1">
                                   <div className="flex justify-between p-1 bg-blue-50 text-gray-800 rounded"><span>LumOs (Master)</span></div>
                                   {adminsList.map(a=><div key={a.id} className="flex justify-between p-1 bg-gray-50 text-gray-800 rounded"><span>{a.id} ({a.name})</span><button onClick={()=>delAdmin(a.id)} className="text-red-500">X</button></div>)}
                                </div>
                             </div>
                        </div>

                        <div className={`lg:col-span-3 ${colors.bgCard} p-6 rounded-xl shadow-sm border ${colors.border}`}>
                            <h3 className={`font-bold mb-4 ${colors.textMain}`} style={customStyle}>Reportes</h3>
                            <div className="grid grid-cols-2 gap-4 mb-4">
                                <div><label className="text-xs font-bold text-gray-400">Fechas</label><div className="flex gap-2"><input type="date" value={filters.start} onChange={e=>setFilters({...filters, start:e.target.value})} className="border p-2 rounded flex-1 bg-gray-700 text-white font-bold" /><input type="date" value={filters.end} onChange={e=>setFilters({...filters, end:e.target.value})} className="border p-2 rounded flex-1 bg-gray-700 text-white font-bold" /></div></div>
                                <div><label className="text-xs font-bold text-gray-400">Horas</label><div className="flex gap-2"><input type="time" value={filters.startTime} onChange={e=>setFilters({...filters, startTime:e.target.value})} className="border p-2 rounded flex-1 bg-gray-700 text-white font-bold" /><input type="time" value={filters.endTime} onChange={e=>setFilters({...filters, endTime:e.target.value})} className="border p-2 rounded flex-1 bg-gray-700 text-white font-bold" /></div></div>
                            </div>
                            <div className="flex gap-2"><button onClick={genReport} className="bg-blue-600 text-white flex-1 p-2 rounded font-bold">Generar</button><button onClick={exportCSV} disabled={!report.length} className="bg-green-600 text-white px-4 rounded font-bold">CSV</button></div>
                            {report.length > 0 && <div className="mt-4 max-h-60 overflow-y-auto border rounded"><table className="w-full text-xs text-left"><thead className="bg-gray-200 text-gray-700 font-bold sticky top-0"><tr><th className="p-2">Nombre</th><th className="p-2">Fecha</th><th className="p-2">Hora</th><th className="p-2">Tipo</th><th className="p-2">Lugar</th></tr></thead><tbody className="bg-white text-gray-900">{report.map((r,i)=><tr key={i} className="border-b"><td className="p-2 font-bold">{r.name}</td><td className="p-2">{r.date}</td><td className="p-2">{r.time}</td><td className="p-2"><span className={`px-2 py-0.5 rounded text-white ${r.type.includes('in')?'bg-green-500':'bg-red-500'}`}>{r.label}</span></td><td className="p-2">{r.isOutOfFence?'❌':'✅'}</td></tr>)}</tbody></table></div>}
                        </div>
                    </div>
                </div>
            );
        };

        const EmployeeScreen = ({ onLogout, employeeData, globalConfig }) => {
            const { collection, addDoc, query, where, onSnapshot, doc, getDoc } = window.firebaseModules.methods;
            const database = window.firebaseModules.db;
            const { colors } = THEMES[globalConfig.theme] || THEMES.azul;
            const [logs, setLogs] = useState([]);
            const [submitting, setSubmitting] = useState(false);
            const appId = "lumos-assist-39e09";

            useEffect(() => {
                const q = query(collection(database, `artifacts/${appId}/public/data/attendance_logs`), where("employeeId", "==", employeeData.id));
                return onSnapshot(q, s => setLogs(s.docs.map(d => ({id:d.id, ...d.data(), timestamp:d.data().timestamp.toDate()})).sort((a,b)=>b.timestamp-a.timestamp)));
            }, [employeeData]);

            const handleClock = async (type) => {
                setSubmitting(true);
                try {
                    const loc = await getUserLocation();
                    const conf = await getDoc(doc(database, `artifacts/${appId}/public/data/settings`, "geofence"));
                    let out = false;
                    if(conf.exists() && conf.data().zones?.length) {
                        if (!conf.data().zones.some(z => getHaversineDistance(loc, z) <= z.radius)) {
                            if(conf.data().blockOutOfFence) throw new Error("Fuera de zona"); out = true;
                        }
                    }
                    await addDoc(collection(database, `artifacts/${appId}/public/data/attendance_logs`), {
                        employeeId: employeeData.id, type, timestamp: window.firebaseModules.methods.serverTimestamp(), location: loc, isOutOfFence: out, userAgent: navigator.userAgent
                    });
                } catch (e) { alert(e.message); }
                setSubmitting(false);
            };

            const last = logs[0]?.type;
            return (
                <div className={`min-h-screen ${colors.bgApp} flex items-center justify-center p-4`}>
                    <div className={`w-full max-w-md ${colors.bgCard} rounded-2xl shadow-xl overflow-hidden border ${colors.border}`}>
                        <div className={`bg-gradient-to-r ${colors.gradient} p-6 text-white text-center`}>
                            <div className="flex justify-center mb-2"><AppLogo url={globalConfig.logoUrl} className="w-16 h-16" /></div>
                            <h2 className="text-2xl font-bold">{employeeData.name}</h2>
                            <p className="opacity-80 text-sm">{employeeData.department}</p>
                            {employeeData.lunchStart && <div className="mt-2 text-xs bg-white/20 inline-block px-3 py-1 rounded-full">🍽️ {employeeData.lunchStart} - {employeeData.lunchEnd}</div>}
                        </div>
                        <div className="p-6 grid gap-3">
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={()=>handleClock('in')} disabled={submitting || last==='in' || last==='break-out'} className="bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-bold shadow-lg disabled:opacity-50 transition">☀️ Entrada</button>
                                <button onClick={()=>handleClock('out')} disabled={submitting || (last!=='in' && last!=='break-in')} className="bg-red-500 hover:bg-red-600 text-white py-3 rounded-lg font-bold shadow-lg disabled:opacity-50 transition">🌙 Salida</button>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={()=>handleClock('break-out')} disabled={submitting || last!=='in'} className="bg-purple-500 hover:bg-purple-600 text-white py-2 rounded-lg text-sm font-bold shadow disabled:opacity-50">☕ Inicio Comida</button>
                                <button onClick={()=>handleClock('break-in')} disabled={submitting || last!=='break-out'} className="bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded-lg text-sm font-bold shadow disabled:opacity-50">🍔 Fin Comida</button>
                            </div>
                            <div className="mt-4 border-t pt-2">
                                <h3 className={`text-xs font-bold uppercase mb-2 ${colors.textSec}`}>Hoy</h3>
                                <div className="max-h-40 overflow-y-auto space-y-2">
                                    {logs.filter(l=>l.timestamp.toDateString()===new Date().toDateString()).map(l=>(
                                        <div key={l.id} className={`flex justify-between items-center p-2 rounded ${colors.inputBg} border ${colors.border}`}>
                                            <span className={`text-xs font-bold uppercase ${l.type.includes('in')?'text-green-600':'text-red-600'}`}>{l.type}</span>
                                            <span className={`text-xs font-mono ${colors.textMain}`}>{l.timestamp.toLocaleTimeString()}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                        <button onClick={onLogout} className="w-full p-3 bg-gray-50 text-gray-500 text-sm hover:bg-gray-100 font-medium border-t">Cerrar Sesión</button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [user, setUser] = useState(null);
            const [admin, setAdmin] = useState(false);
            const [emp, setEmp] = useState(null);
            const [adminName, setAdminName] = useState('');
            const [config, setConfig] = useState({ theme: 'azul', logoUrl: '', textColor: '' });

            useEffect(() => {
                const checkFirebase = () => {
                    if (window.firebaseModules) {
                        setIsFirebaseReady(true);
                        const { auth, methods } = window.firebaseModules;
                        methods.onAuthStateChanged(auth, u => {
                            if(u) setUser(u); else methods.signInAnonymously(auth).catch(console.error);
                        });
                        document.getElementById('loader-overlay').style.opacity = '0';
                        setTimeout(() => document.getElementById('loader-overlay').style.display = 'none', 500);
                    }
                };
                window.addEventListener('firebase-ready', checkFirebase);
                checkFirebase();
                return () => window.removeEventListener('firebase-ready', checkFirebase);
            }, []);

            useEffect(() => {
                if(!user || !isFirebaseReady) return;
                const { db, methods } = window.firebaseModules;
                return methods.onSnapshot(methods.doc(db, `artifacts/lumos-assist-39e09/public/data/settings`, "config"), s => s.exists() && setConfig(s.data()));
            }, [user, isFirebaseReady]);

            const handleLogin = (id, isAdmin, name) => {
                if (isAdmin) { setAdmin(true); setEmp(null); setAdminName(name); } 
                else { setAdmin(false); setEmp({ id, name }); }
            };

            if (!isFirebaseReady) return null; // El loader HTML se encarga de esto
            if (admin) return <AdminDashboard onLogout={()=>setAdmin(false)} userId={user?.uid} currentAdminName={adminName} globalConfig={config} />;
            if (emp) return <EmployeeScreen onLogout={()=>setEmp(null)} employeeData={emp} globalConfig={config} />;
            return <LoginScreen onLogin={handleLogin} globalConfig={config} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
